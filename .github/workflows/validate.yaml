# Catches broken manifests before Argo CD does: every kustomize folder must
# build, and every resource (CRDs included) must match its schema.
name: validate

on:
  push:
  pull_request:

# Public repo: anyone can open a PR. Keep the job token read-only.
permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      # sha256 of kubeconform-linux-amd64.tar.gz, from the release's CHECKSUMS.
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
      # CRD schemas, pinned to a commit so upstream changes can't flip results.
      CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/3eb90d47aba8d61919d4419dd38301536e32a94b
    steps:
      # Pinned to a commit, not a tag: tags can be moved to malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No plain Secrets in git
        run: |
          if grep -rlE '^kind: Secret$' --include='*.yaml' .; then
            echo "Plain Secret found. Use a SealedSecret (scripts/seal-secrets.sh)." >&2
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -sSfLo kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          sudo tar xzf kc.tgz -C /usr/local/bin kubeconform

      - name: Build and validate
        run: |
          {
            for dir in infrastructure/* apps/*; do
              kubectl kustomize "$dir"
              echo ---
            done
            for f in argocd/apps/*.yaml bootstrap/root-app.yaml; do
              cat "$f"
              echo ---
            done
          } | kubeconform -strict -summary \
                -schema-location default \
                -schema-location "${CRDS_CATALOG}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
