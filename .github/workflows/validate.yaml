# Checks every push and PR: every kustomize folder must build, every resource
# (CRDs included) must match its schema, the repo conventions in
# scripts/check-policy.py must hold, and the Helm charts must render with our
# values. On a live cluster this only DETECTS: Argo CD syncs main whatever CI
# says. To block bad changes, protect main and merge through PRs.
# Same checks locally: see scripts/check-policy.py.
name: validate

on:
  push:
  pull_request:

# Public repo: anyone can open a PR. Keep the job token read-only.
permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      # sha256 of kubeconform-linux-amd64.tar.gz, from the release's CHECKSUMS.
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
      # CRD schemas, pinned to a commit so upstream changes can't flip results.
      CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/3eb90d47aba8d61919d4419dd38301536e32a94b
    steps:
      # Pinned to a commit, not a tag: tags can be moved to malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in .git/config for later steps.
          persist-credentials: false

      - name: No plain Secrets in git
        run: |
          if grep -rlE '^kind: Secret$' --include='*.yaml' .; then
            echo "Plain Secret found. Use a SealedSecret (scripts/seal-secrets.sh)." >&2
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -sSfLo kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          sudo tar xzf kc.tgz -C /usr/local/bin kubeconform

      - name: Render
        # One file, every document separated by ---. Without the separators
        # YAML silently merges files and later keys win.
        run: |
          {
            for dir in infrastructure/* apps/*; do
              kubectl kustomize "$dir"
              echo ---
            done
            for f in argocd/apps/*.yaml bootstrap/root-app.yaml; do
              cat "$f"
              echo ---
            done
          } > rendered.yaml

      - name: Schemas
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "${CRDS_CATALOG}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            rendered.yaml

      - name: PyYAML
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || { sudo apt-get update -q && sudo apt-get install -y -q python3-yaml; }

      - name: Conventions
        run: python3 scripts/check-policy.py < rendered.yaml

      # The charts are upstream code; this checks that our values render into
      # valid objects (e.g. a typo in bootstrap/argocd-values.yaml).
      # CustomResourceDefinitions have no schema in kubeconform's default set.
      - name: Helm charts with our values
        run: |
          python3 scripts/render-charts.py > charts.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location "${CRDS_CATALOG}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            charts.yaml
