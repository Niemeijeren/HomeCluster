apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  labels:
    app: portainer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      # Runs on the namespace's default ServiceAccount, which has no RBAC, so
      # Portainer can't manage this cluster yet. Granting it access (it wants
      # cluster-admin) is a deliberate decision for later. With Argo CD as the
      # source of truth, Portainer should be read-mostly anyway.
      containers:
        - name: portainer
          # Same digest the :latest tag resolved to (sha256:3609c307…)
          image: portainer/portainer-ce:2.45.3
          ports:
            - name: http
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portainer-pvc
