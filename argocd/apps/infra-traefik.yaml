apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/your-github-user/HomeCluster.git
    targetRevision: main
    path: infrastructure/traefik
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Its CRDs come from an earlier wave; don't fail the dry run if they're not there yet.
      - SkipDryRunOnMissingResource=true
