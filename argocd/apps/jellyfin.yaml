apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-github-user/HomeCluster.git
    targetRevision: main
    path: apps/jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    # Argo never retries a failed automated sync on the same commit by itself,
    # so e.g. a cold rebuild where a CRD isn't there yet would stall until the
    # next commit. Back off and retry instead. refresh: each attempt uses the
    # latest commit, so a fix pushed mid-retry isn't locked out for ~30 min.
    retry:
      refresh: true
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
