# Installs cert-manager from its Helm chart. Bump targetRevision here to upgrade.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    # Argo never retries a failed automated sync on the same commit by itself,
    # so e.g. a cold rebuild where a CRD isn't there yet would stall until the
    # next commit. Back off and retry instead. refresh: each attempt uses the
    # latest commit, so a fix pushed mid-retry isn't locked out for ~30 min.
    retry:
      refresh: true
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
