# k3s uses the Tailscale IP as its node-ip (/etc/rancher/k3s/config.yaml), so it
# must not start before tailscale0 has its address. tailscaled being "started"
# isn't enough: the interface gets its IP a few seconds later.
# If the IP doesn't appear within 60s this fails, and k3s's Restart=always retries.
[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
ExecStartPre=/usr/bin/timeout 60 /bin/sh -c 'until ip -4 addr show dev tailscale0 2>/dev/null | grep -q "inet 100[.]"; do sleep 1; done'
