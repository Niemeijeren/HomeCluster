apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - schedule.yaml
  # Encrypted with the sealed-secrets controller's public key (see README "Secrets").
  # R2 access key for the bucket, as an AWS credentials file under key `cloud`.
  - r2-credentials.sealed.yaml
  # Password for Velero's Kopia repository. Without it, Velero falls back to a
  # hard-coded default password, which would make the offsite data effectively unencrypted.
  - repo-credentials.sealed.yaml
