apiVersion: v1
kind: Namespace
metadata:
  name: website
  labels:
    # The website will be public and deployed by CI: the API server rejects any
    # pod that isn't "restricted" (no privileged, hostPath, host namespaces,
    # root, capabilities). The AppProject limits kinds; this limits pods.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
